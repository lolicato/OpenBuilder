site_name: OpenMembraneBuilder
site_description: GUI and CLI builder for Martini coarse-grained membrane/protein systems
site_author: Fabio
repo_name: OpenMembraneBuilder

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: red
      accent: red

nav:
  - Home: index.md
  - Installation: installation.md
  - GUI Usage: gui.md
  - CLI Usage: cli.md
  - Builders: 
    - General: builders.md
    - Membrane: membrane_builder.md
    - Martinize: martinize_builder.md
    - CGLipid: cglipid_builder.md
  - Outputs: 
    - General: outputs.md
    - JSON Config: json-index.md
  - Citation: citation.md
  - Contributing: contributing.md
  - License: license.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true